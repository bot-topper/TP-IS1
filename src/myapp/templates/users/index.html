{% extends "base.html" %}

{% block content %}
<h1>Users</h1>
<ul>
  {% for user in users %}
    <li>
      <a href="{{ url_for('users.detail', user_id=user.id) }}">
        {{ user.name }}
      </a> — {{ user.email }}
    </li>
  {% else %}
    <li>No hay usuarios</li>
  {% endfor %}
</ul>
{% endblock %}
